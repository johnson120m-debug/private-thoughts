name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static export)
        run: bun run build

      - name: Debug build output (optional)
        run: |
          echo "Contents of dist/"
          ls -la dist/ || true
          echo "Contents of dist/client/ (if exists)"
          ls -la dist/client/ 2>/dev/null || true

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-artifact
          if [ -d "dist/client" ]; then
            cp -R dist/client/. pages-artifact/
          else
            cp -R dist/. pages-artifact/
          fi
          if [ -f "dist/sw.js" ]; then
            cp dist/sw.js pages-artifact/sw.js
          fi
          find dist -maxdepth 1 -name 'workbox-*.js' -exec cp {} pages-artifact/ \; 2>/dev/null || true
          if [ -f pages-artifact/index.html ]; then
            cp pages-artifact/index.html pages-artifact/404.html
          else
            echo "<h1>404 - Page Not Found</h1>" > pages-artifact/404.html
          fi
          touch pages-artifact/.nojekyll
          if [ ! -s pages-artifact/index.html ]; then
            echo "❌ ERROR: index.html is missing or empty"
            exit 1
          fi
          if [ ! -s pages-artifact/404.html ]; then
            echo "❌ ERROR: 404.html is missing or empty"
            exit 1
          fi
          echo "✅ Pages artifact ready"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
