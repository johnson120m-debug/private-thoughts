name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static export)
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-artifact
          cp -R dist/client/. pages-artifact/
          cp dist/sw.js pages-artifact/sw.js
          find dist -maxdepth 1 -name 'workbox-*.js' -exec cp {} pages-artifact/ \;
          cp pages-artifact/index.html pages-artifact/404.html
          touch pages-artifact/.nojekyll
          test -s pages-artifact/index.html
          test -s pages-artifact/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
